version: '3.8'

services:
  python_ai:
    build:
      context: ./Khatwaat-Ai-main/backend
      dockerfile: Dockerfile
    container_name: python_ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  nodejs_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
      # Add your MongoDB connection string to the .env file before running in production!
      # For now, it will use the hardcoded one in your db.connect.js
    depends_on:
      - python_ai
    restart: always
